name: sports-leader-mcp
description: >-
  Free MCP server for live sports data — scores, standings, rosters, player stats,
  betting odds, play-by-play, injuries, transactions, and news across 17 sports
  and 139 leagues. 20 tools, 4 resources, 5 prompts. No auth required.
version: 0.1.0
license: MIT
keywords:
  - sports
  - scores
  - standings
  - stats
  - odds
  - nfl
  - nba
  - mlb
  - nhl
  - soccer
  - mcp
  - live-data
  - play-by-play
  - injuries
  - betting
homepage: https://walrusquant.github.io/sports-leader-mcp/
repository: https://github.com/WalrusQuant/sports-leader-mcp
icon: https://walrusquant.github.io/sports-leader-mcp/assets/og-image.png
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      timeout:
        type: number
        title: Request Timeout
        description: Timeout in milliseconds for upstream ESPN API calls. Default is 30000 (30 seconds).
        default: 30000
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        SPORTS_LEADER_TIMEOUT: String(config.timeout || 30000)
      }
    })
build:
  dockerfile: Dockerfile
