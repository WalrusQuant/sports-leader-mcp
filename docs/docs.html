<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs — sports-leader-mcp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown + syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --card: #161616;
      --card-border: rgba(255,255,255,0.06);
      --accent: #FF6B00;
      --accent-dim: rgba(255,107,0,0.12);
      --accent-glow: rgba(255,107,0,0.25);
      --text: #EBEBEB;
      --text-mid: #999;
      --text-dim: #555;
      --sidebar-w: 280px;
      --display: 'Bebas Neue', sans-serif;
      --body: 'DM Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      display: flex;
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #ff8533; }

    /* ─── SIDEBAR ─── */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--card-border);
      overflow-y: auto;
      padding: 1.5rem 0;
      z-index: 10;
    }

    .sidebar-brand {
      font-family: var(--display);
      font-size: 1.3rem;
      letter-spacing: 2px;
      padding: 0 1.5rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1rem;
    }
    .sidebar-brand a { color: var(--text); }
    .sidebar-brand span { color: var(--accent); }

    .sidebar-search {
      padding: 0 1rem 1rem;
    }
    .sidebar-search input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-family: var(--body);
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .sidebar-search input:focus {
      border-color: rgba(255,107,0,0.4);
    }
    .sidebar-search input::placeholder { color: var(--text-dim); }

    .sidebar-nav { padding: 0 0.75rem; }

    .nav-group-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      font-weight: 600;
      padding: 1.25rem 0.75rem 0.35rem;
    }

    .nav-item {
      display: block;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-mid);
      transition: all 0.15s;
      cursor: pointer;
    }
    .nav-item:hover {
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }
    .nav-item.active {
      color: var(--accent);
      background: var(--accent-dim);
    }

    .sidebar-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--card-border);
      margin-top: 1rem;
    }
    .sidebar-footer a {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      padding: 0.25rem 0;
    }
    .sidebar-footer a:hover { color: var(--text-mid); }

    /* ─── CONTENT ─── */
    .content {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-width: 0;
    }

    .content-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 3rem 3rem 6rem;
    }

    /* ─── MARKDOWN STYLING ─── */
    .md h1 {
      font-family: var(--display);
      font-size: 2.75rem;
      letter-spacing: 2px;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--accent);
    }
    .md h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--card-border);
      color: var(--text);
    }
    .md h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
      color: var(--text);
    }
    .md h4 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      color: var(--text-mid);
    }

    .md p {
      margin-bottom: 1rem;
      color: var(--text-mid);
    }
    .md strong { color: var(--text); }

    .md ul, .md ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
      color: var(--text-mid);
    }
    .md li { margin-bottom: 0.35rem; }
    .md li strong { color: var(--text); }

    .md blockquote {
      border-left: 3px solid var(--accent);
      background: var(--accent-dim);
      padding: 1rem 1.25rem;
      margin: 1.25rem 0;
      border-radius: 0 8px 8px 0;
    }
    .md blockquote p { color: var(--text-mid); margin-bottom: 0; }

    .md code {
      font-family: var(--mono);
      font-size: 0.85em;
      background: var(--card);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      color: var(--accent);
    }

    .md pre {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin: 1rem 0 1.5rem;
      overflow-x: auto;
      position: relative;
    }
    .md pre code {
      background: none;
      padding: 0;
      color: var(--text);
      font-size: 0.825rem;
      line-height: 1.7;
    }

    /* Copy button */
    .md pre .copy-btn {
      position: absolute;
      top: 0.6rem; right: 0.6rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      font-family: var(--body);
      font-size: 0.65rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, color 0.2s;
    }
    .md pre:hover .copy-btn { opacity: 1; }
    .md pre .copy-btn:hover { color: var(--text); }

    .md table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.85rem;
    }
    .md th {
      text-align: left;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      font-weight: 600;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--card-border);
    }
    .md td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--card-border);
      color: var(--text-mid);
    }
    .md tr:hover td { background: rgba(255,255,255,0.015); }
    .md td code {
      font-size: 0.8em;
      color: var(--accent);
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--card-border);
      margin: 2.5rem 0;
    }

    .md img {
      max-width: 100%;
      border-radius: 8px;
    }

    /* ─── MOBILE ─── */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 1rem; left: 1rem;
      z-index: 20;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 40px; height: 40px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .mobile-toggle { display: flex; }
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
      }
      .sidebar.open { transform: translateX(0); }
      .content { margin-left: 0; }
      .content-inner { padding: 3rem 1.5rem; }
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text-dim);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">&#9776;</button>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a href="index.html">SPORTS<span>LEADER</span></a>
    </div>

    <div class="sidebar-search">
      <input type="text" placeholder="Search docs..." id="search-input">
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <a class="nav-item" data-page="README">Home</a>
      <a class="nav-item" data-page="getting-started">Getting Started</a>

      <div class="nav-group-label">Tools</div>
      <a class="nav-item" data-page="tools/">Overview</a>
      <a class="nav-item" data-page="tools/discovery">Discovery &amp; Search</a>
      <a class="nav-item" data-page="tools/scoreboard">Scoreboard &amp; Games</a>
      <a class="nav-item" data-page="tools/teams">Teams</a>
      <a class="nav-item" data-page="tools/athletes">Athletes</a>
      <a class="nav-item" data-page="tools/league">League-Wide</a>

      <div class="nav-group-label">Reference</div>
      <a class="nav-item" data-page="reference/">Reference Home</a>
      <a class="nav-item" data-page="reference/endpoints">API Endpoints</a>
      <a class="nav-item" data-page="reference/response-schemas">Response Schemas</a>
      <a class="nav-item" data-page="reference/league-slugs">League &amp; Sport Slugs</a>
      <a class="nav-item" data-page="reference/gotchas">Gotchas &amp; Pitfalls</a>
    </nav>

    <div class="sidebar-footer">
      <a href="index.html">&larr; Back to Home</a>
      <a href="https://github.com/WalrusQuant/sports-leader-mcp" target="_blank">GitHub</a>
      <a href="https://smithery.ai/servers/wickwireadam-o0nh/sports-leader-mcp" target="_blank">Smithery</a>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="content">
    <div class="content-inner">
      <div class="md" id="md-content">
        <div class="loading">Loading</div>
      </div>
    </div>
  </main>

  <script>
    const contentEl = document.getElementById('md-content');
    const navItems = document.querySelectorAll('.nav-item[data-page]');
    const searchInput = document.getElementById('search-input');

    // Parse markdown — handle different marked.js API versions
    function parseMd(text) {
      if (typeof marked.parse === 'function') return marked.parse(text, { gfm: true });
      if (typeof marked === 'function') return marked(text, { gfm: true });
      throw new Error('marked library not loaded');
    }

    // Resolve page path to .md file URL
    function pageToUrl(page) {
      if (page.endsWith('/')) return page + 'README.md';
      return page + '.md';
    }

    // Load and render a markdown page
    async function loadPage(page) {
      contentEl.innerHTML = '<div class="loading">Loading</div>';

      // Step 1: Fetch
      let md;
      try {
        const url = pageToUrl(page);
        const res = await fetch(url);
        if (!res.ok) {
          contentEl.innerHTML = '<p style="color:var(--text-dim)">Page not found (HTTP ' + res.status + ').</p>';
          return;
        }
        md = await res.text();
      } catch (err) {
        contentEl.innerHTML = '<p style="color:var(--text-dim)">Failed to load page: ' + err.message + '</p>';
        return;
      }

      // Step 2: Parse markdown
      try {
        contentEl.innerHTML = parseMd(md);
      } catch (err) {
        // Fallback: show raw markdown in a pre block
        contentEl.innerHTML = '<pre style="white-space:pre-wrap;color:var(--text-mid)">' + md.replace(/</g,'&lt;') + '</pre>';
        console.error('Markdown parse error:', err);
      }

      // Step 3: Syntax highlight (isolated — never kills the page)
      try {
        contentEl.querySelectorAll('pre code').forEach(function(block) {
          hljs.highlightElement(block);
        });
      } catch (e) { console.warn('Highlight error:', e); }

      // Step 4: Add copy buttons
      contentEl.querySelectorAll('pre').forEach(function(pre) {
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = function() {
          var code = pre.querySelector('code');
          navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
          btn.textContent = 'Copied!';
          setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
        };
        pre.style.position = 'relative';
        pre.appendChild(btn);
      });

      // Step 5: Intercept internal .md links
      contentEl.querySelectorAll('a[href]').forEach(function(link) {
        var href = link.getAttribute('href');
        if (!href) return;
        if (href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:')) return;
        if (href.endsWith('.md') || href.indexOf('.md#') !== -1) {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            var target = href.replace(/\.md(#.*)?$/, '$1');
            if (target.indexOf('/') === -1 && target !== 'README' && target !== 'getting-started') {
              var currentDir = page.indexOf('/') !== -1 ? page.substring(0, page.lastIndexOf('/') + 1) : '';
              target = currentDir + target;
            }
            if (target.endsWith('/README') || target === 'README') {
              target = target.replace(/README$/, '') || 'README';
            }
            navigate(target);
          });
        }
      });

      // Step 6: Update active nav
      navItems.forEach(function(n) {
        n.classList.toggle('active', n.dataset.page === page);
      });

      // Step 7: Scroll
      window.scrollTo(0, 0);

      // Step 8: Close mobile sidebar
      document.querySelector('.sidebar').classList.remove('open');
    }

    // Hash-based routing
    function getPageFromHash() {
      var hash = window.location.hash.slice(1);
      if (!hash) return 'README';
      return hash;
    }

    function navigate(page) {
      window.location.hash = page;
    }

    // Nav click handlers
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        navigate(item.dataset.page);
      });
    });

    // Hash change listener
    window.addEventListener('hashchange', () => {
      loadPage(getPageFromHash());
    });

    // Simple search — filter nav items
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      navItems.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = q && !text.includes(q) ? 'none' : 'block';
      });
    });

    // Initial load
    loadPage(getPageFromHash());
  </script>
</body>
</html>
