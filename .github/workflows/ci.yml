# Offline suite. engines is >=20; Node 22 is the LTS line this repo typechecks
# against (@types/node 22). Tests use fixtures and must not call live hosts.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
      - name: Install lab
        working-directory: lab
        run: uv sync --frozen --group dev
      - name: Lint lab
        working-directory: lab
        run: uv run ruff check
      - name: Typecheck lab
        working-directory: lab
        run: uv run mypy src
      - name: Test lab
        working-directory: lab
        run: uv run pytest
