[project]
name = "sports-leader-lab"
version = "0.1.0"
description = "Research lab for walk-forward sports models on the public sportsleader-data Parquet. Not a betting edge."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "mcp>=2.0,<3",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[project.scripts]
sports-leader-lab = "sports_leader_lab.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = [
    "live: downloads the public sportsleader-data release; set SPORTSLEADER_LAB_LIVE=1",
]
